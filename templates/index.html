<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffd700">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <title>🎰 Pontinho Vegas 🎰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --text: #fff;
            --gold: #ffd700;
            --pink: #ff4488;
            --green: #00ff88;
            --cyan: #00ddff;
            --red: #ff0044;
            --card-bg-1: rgba(25, 10, 45, 0.95);
            --card-bg-2: rgba(15, 5, 30, 0.98);
            --setup-bg-1: rgba(30, 10, 50, 0.9);
            --setup-bg-2: rgba(10, 5, 25, 0.95);
            --history-bg: rgba(15, 5, 30, 0.8);
            --border-gold: rgba(255, 215, 0, 0.3);
            --border-soft: rgba(255, 215, 0, 0.2);
            --input-bg: rgba(255, 255, 255, 0.05);
            --muted: #aaa;
            --neon-anim: borderGlow 3s linear infinite;
            --card-border-anim: cardBorder 4s ease infinite;
            --bg-radials:
                radial-gradient(ellipse at 20% 50%, rgba(120, 0, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 0, 100, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        }

        body.theme-calm {
            --bg: #131826;
            --text: #e7eaf2;
            --gold: #f0c674;
            --pink: #b48ead;
            --green: #88c9a1;
            --cyan: #81a2be;
            --red: #cc6666;
            --card-bg-1: #1f2333;
            --card-bg-2: #181b28;
            --setup-bg-1: #1d2230;
            --setup-bg-2: #161a26;
            --history-bg: #1a1e2b;
            --border-gold: rgba(240, 198, 116, 0.35);
            --border-soft: rgba(240, 198, 116, 0.18);
            --input-bg: rgba(255, 255, 255, 0.04);
            --muted: #8a93a6;
            --neon-anim: none;
            --card-border-anim: none;
            --bg-radials: none;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image: var(--bg-radials);
            font-family: 'Orbitron', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        body.theme-calm .floating-cards { display: none; }
        body.theme-calm .neon-border { display: none; }
        body.theme-calm .header h1 { animation: none; filter: none; text-shadow: none; }
        body.theme-calm .subtitle { animation: none; text-shadow: none; opacity: 0.8; }
        body.theme-calm .marquee-lights { display: none; }
        body.theme-calm .player-card::before { display: none; }
        body.theme-calm .player-card.winner { animation: none; }
        body.theme-calm .btn-gold { animation: none; }
        body.theme-calm .btn-reentry { animation: none; }

        .neon-border {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
            border: 3px solid transparent;
            border-image: linear-gradient(90deg, #ff0055, #ffdd00, #00ff88, #00ddff, #ff0055) 1;
            animation: var(--neon-anim);
        }
        @keyframes borderGlow { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

        .header { text-align: center; padding: 30px 20px 10px; position: relative; z-index: 1; }
        .header h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #ffd700, #ff6b00, #ffd700, #fff176);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmer 3s ease infinite;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            letter-spacing: 4px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }
        @keyframes goldShimmer { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .header .subtitle {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.65rem; color: var(--pink); margin-top: 8px;
            text-shadow: 0 0 10px var(--pink), 0 0 20px var(--pink);
            animation: neonPulse 2s ease-in-out infinite;
            letter-spacing: 3px;
        }
        @keyframes neonPulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .marquee-lights { display: flex; justify-content: center; gap: 12px; margin: 15px 0; }
        .light-bulb { width: 10px; height: 10px; border-radius: 50%; animation: bulbChase 1.5s ease-in-out infinite; }
        .light-bulb:nth-child(odd)  { background: #ffd700; box-shadow: 0 0 8px #ffd700; }
        .light-bulb:nth-child(even) { background: #ff0055; box-shadow: 0 0 8px #ff0055; }
        .light-bulb:nth-child(1){animation-delay:0s}.light-bulb:nth-child(2){animation-delay:.1s}
        .light-bulb:nth-child(3){animation-delay:.2s}.light-bulb:nth-child(4){animation-delay:.3s}
        .light-bulb:nth-child(5){animation-delay:.4s}.light-bulb:nth-child(6){animation-delay:.5s}
        .light-bulb:nth-child(7){animation-delay:.6s}.light-bulb:nth-child(8){animation-delay:.7s}
        .light-bulb:nth-child(9){animation-delay:.8s}.light-bulb:nth-child(10){animation-delay:.9s}
        .light-bulb:nth-child(11){animation-delay:1s}.light-bulb:nth-child(12){animation-delay:1.1s}
        .light-bulb:nth-child(13){animation-delay:1.2s}.light-bulb:nth-child(14){animation-delay:1.3s}
        .light-bulb:nth-child(15){animation-delay:1.4s}
        @keyframes bulbChase { 0%,100% { opacity: 0.3; transform: scale(0.8);} 50% { opacity: 1; transform: scale(1.3);} }

        .top-bar {
            position: fixed; top: 14px; right: 18px; z-index: 50;
            display: flex; gap: 8px;
        }
        .icon-btn {
            background: rgba(0,0,0,0.45); border: 1px solid var(--border-gold);
            color: var(--gold); width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; display: flex;
            align-items: center; justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .icon-btn:hover { transform: scale(1.1); background: rgba(255,215,0,0.15); }

        .room-badge {
            display: inline-block; padding: 4px 12px; border-radius: 14px;
            font-size: 0.65rem; letter-spacing: 1px;
            background: rgba(0, 221, 255, 0.15); color: var(--cyan);
            border: 1px solid rgba(0, 221, 255, 0.4); margin-top: 6px;
        }

        .setup-screen, .game-screen { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }
        .setup-card {
            background: linear-gradient(145deg, var(--setup-bg-1), var(--setup-bg-2));
            border: 2px solid var(--border-gold); border-radius: 20px; padding: 40px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }
        .setup-card h2 { font-size: 1.3rem; color: var(--gold); margin-bottom: 25px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        .player-inputs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .player-input-row { display: flex; align-items: center; gap: 10px; justify-content: center; }
        .player-input-row label { font-size: 0.75rem; color: var(--pink); min-width: 100px; text-align: right; }

        input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 2px solid var(--border-gold);
            border-radius: 10px; padding: 12px 16px; color: var(--text);
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem;
            outline: none; transition: all 0.3s; width: 200px;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        input[type="number"] { width: 100px; text-align: center; }

        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px;
            text-align: left; margin: 18px auto 20px;
            max-width: 520px; padding: 16px;
            background: rgba(0,0,0,0.25); border-radius: 12px;
            border: 1px dashed var(--border-gold);
        }
        .settings-grid label { font-size: 0.7rem; color: var(--gold); letter-spacing: 1px; }
        .settings-grid .field { display: flex; flex-direction: column; gap: 6px; }
        .settings-grid input[type="number"], .settings-grid input[type="text"] { width: 100%; padding: 8px 10px; font-size: 0.8rem; }
        .settings-grid .check { display: flex; align-items: center; gap: 8px; padding-top: 18px; }

        .btn {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.9rem;
            padding: 14px 35px; border: none; border-radius: 12px; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
            position: relative; overflow: hidden;
        }
        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            background-size: 200% 200%; color: #1a0a00;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            animation: btnGold 2s ease infinite;
        }
        @keyframes btnGold { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .btn-gold:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 30px rgba(255, 215, 0, 0.6); }
        .btn-red   { background: linear-gradient(135deg, #ff0044, #cc0033); color: #fff; box-shadow: 0 4px 15px rgba(255, 0, 68, 0.3); }
        .btn-red:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 0, 68, 0.5); }
        .btn-green { background: linear-gradient(135deg, #00cc66, #009944); color: #fff; box-shadow: 0 4px 15px rgba(0, 204, 102, 0.3); }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 204, 102, 0.5); }
        .btn-sm { padding: 8px 18px; font-size: 0.7rem; }
        .btn-ghost {
            background: transparent; border: 1px solid var(--border-gold); color: var(--gold);
        }
        .btn-ghost:hover { background: rgba(255,215,0,0.1); }

        .add-player-btn {
            background: none; border: 2px dashed rgba(255, 215, 0, 0.4); color: var(--gold);
            padding: 10px 20px; border-radius: 10px; cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-size: 0.75rem;
            transition: all 0.3s; margin-bottom: 20px;
        }
        .add-player-btn:hover { border-color: var(--gold); background: rgba(255, 215, 0, 0.1); }
        .remove-btn {
            background: rgba(255, 0, 68, 0.2); border: 1px solid rgba(255, 0, 68, 0.4); color: #ff4466;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .remove-btn:hover { background: rgba(255, 0, 68, 0.4); transform: scale(1.1); }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .round-badge {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(255, 0, 85, 0.1));
            border: 1px solid rgba(255, 0, 85, 0.5); border-radius: 30px;
            padding: 8px 24px; font-size: 0.8rem; color: var(--pink);
        }

        .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .player-card {
            background: linear-gradient(145deg, var(--card-bg-1), var(--card-bg-2));
            border: 2px solid var(--border-soft); border-radius: 16px; padding: 24px 20px;
            text-align: center; position: relative; overflow: hidden; transition: all 0.4s;
        }
        .player-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ffd700, #ff0055, #00ff88, #00ddff, #ffd700);
            background-size: 400% 400%; border-radius: 18px; z-index: -1;
            animation: var(--card-border-anim); opacity: 0; transition: opacity 0.4s;
        }
        .player-card:hover::before { opacity: 1; }
        .player-card:hover { transform: translateY(-5px); box-shadow: 0 10px 40px rgba(255, 215, 0, 0.15); }
        @keyframes cardBorder { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .player-card.eliminated {
            border-color: rgba(255, 0, 0, 0.5);
            background: linear-gradient(145deg, rgba(50, 5, 5, 0.95), rgba(30, 0, 0, 0.98));
            opacity: 0.7;
        }
        .player-card.eliminated .player-name { text-decoration: line-through; color: #ff4444; }
        .player-card.winner { border-color: rgba(0, 255, 136, 0.8); box-shadow: 0 0 30px rgba(0, 255, 136, 0.3); animation: winnerGlow 1.5s ease-in-out infinite; }
        @keyframes winnerGlow { 0%,100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); } 50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.5); } }
        .player-card.pending-submitted { border-color: rgba(0, 255, 136, 0.6); box-shadow: 0 0 18px rgba(0, 255, 136, 0.18); }

        .player-avatar {
            width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 0, 85, 0.2));
            border: 2px solid var(--border-gold);
        }
        .player-name { font-size: 0.9rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .player-score {
            font-family: 'Russo One', sans-serif; font-size: 2.8rem;
            background: linear-gradient(135deg, #fff, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1; margin-bottom: 6px;
        }
        .player-remaining { font-size: 0.65rem; color: var(--muted); margin-bottom: 14px; }
        .player-remaining span { color: var(--green); font-weight: 700; font-size: 0.9rem; }
        .player-card.danger .player-remaining span { color: var(--red); animation: dangerPulse 0.8s ease-in-out infinite; }
        @keyframes dangerPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .score-input-area { display: flex; gap: 6px; justify-content: center; align-items: center; }
        .score-input-area input { width: 70px; padding: 8px; font-size: 0.8rem; text-align: center; }
        .score-input-area .btn { padding: 8px 12px; font-size: 0.65rem; }

        .pending-badge {
            display: inline-block; background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.5); color: var(--green);
            padding: 6px 14px; border-radius: 16px; font-size: 0.7rem; letter-spacing: 1px;
        }

        .overlay-base {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .bomb-emoji { font-size: 8rem; animation: bombShake 0.5s ease-in-out infinite; }
        @keyframes bombShake {
            0%,100% { transform: rotate(-5deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-3deg) scale(1); }
            75% { transform: rotate(3deg) scale(1.05); }
        }
        .bomb-text {
            font-family: 'Russo One', sans-serif; font-size: 2rem; color: var(--red);
            text-shadow: 0 0 20px var(--red), 0 0 40px var(--red);
            margin-top: 20px; animation: bombTextPulse 0.5s ease-in-out infinite;
        }
        @keyframes bombTextPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .bomb-player-name { font-size: 1.5rem; color: var(--gold); margin-top: 10px; text-align: center; padding: 0 14px; }

        .explosion-container { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        .particle { position: absolute; border-radius: 50%; animation: explode 1.5s ease-out forwards; }
        @keyframes explode {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .winner-trophy { font-size: 6rem; animation: trophyBounce 1s ease-in-out infinite; }
        @keyframes trophyBounce { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        .winner-text {
            font-family: 'Russo One', sans-serif; font-size: 2.5rem;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-top: 20px; text-align: center;
        }
        .winner-name { font-size: 1.8rem; color: var(--green); margin-top: 10px; text-align: center; }

        .history-section { margin-top: 30px; }
        .history-section h3 { font-size: 1rem; color: var(--gold); margin-bottom: 15px; text-align: center; }
        .history-table {
            width: 100%; border-collapse: collapse;
            background: var(--history-bg); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border-soft);
        }
        .history-table th {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            padding: 12px 15px; font-size: 0.7rem; color: var(--gold);
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 2px solid var(--border-soft);
        }
        .history-table td { padding: 10px 15px; font-size: 0.75rem; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ccc; }
        .history-table tr:hover td { background: rgba(255, 215, 0, 0.05); }
        .history-table .positive { color: #ff6666; }
        .history-table .zero { color: #888; }
        .history-table .trophy-cell { font-size: 1.4rem; }

        .confetti-piece { position: fixed; width: 10px; height: 10px; top: -20px; z-index: 1001; animation: confettiFall linear forwards; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        .floating-cards { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .floating-card { position: absolute; font-size: 2rem; opacity: 0.06; animation: floatCard linear infinite; }
        @keyframes floatCard { 0% { transform: translateY(110vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }

        .actions-bar { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }

        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .players-grid { grid-template-columns: 1fr; }
            .setup-card { padding: 25px 15px; }
            .player-score { font-size: 2.2rem; }
            .settings-grid { grid-template-columns: 1fr; }
        }

        .hidden { display: none !important; }

        .score-flash {
            position: absolute; top: 20px; right: 20px;
            font-size: 1.2rem; font-weight: 700;
            animation: scoreFlash 1.5s ease-out forwards; pointer-events: none;
        }
        @keyframes scoreFlash {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
        }

        .eliminated-badge {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 3rem; z-index: 10;
        }

        .reentry-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.25), rgba(120, 0, 255, 0.25));
            border: 1px solid rgba(0, 200, 255, 0.6); border-radius: 20px;
            padding: 3px 12px; font-size: 0.55rem; color: var(--cyan);
            margin-top: 6px; letter-spacing: 1px;
        }
        .reentry-count { color: #ffdd00; font-weight: 700; }
        .player-card.reentered { border-color: rgba(0, 200, 255, 0.4); }

        .btn-reentry {
            background: linear-gradient(135deg, #00bbff, #7700ff, #00bbff);
            background-size: 200% 200%; color: #fff;
            box-shadow: 0 4px 20px rgba(0, 180, 255, 0.4);
            animation: btnReentry 2s ease infinite;
        }
        @keyframes btnReentry { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .btn-reentry:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 30px rgba(0, 180, 255, 0.6); }

        .reentry-info { font-size: 0.75rem; color: var(--muted); margin-top: 12px; }
        .reentry-info span { color: var(--cyan); font-weight: 700; }

        .bomb-buttons { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }

        .eliminated-actions { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 10px; }

        /* RANKING */
        .ranking-card {
            background: linear-gradient(145deg, var(--setup-bg-1), var(--setup-bg-2));
            border: 2px solid rgba(0, 255, 136, 0.25);
            border-radius: 20px; padding: 24px; margin-top: 22px;
        }
        .ranking-card h3 {
            color: var(--gold); font-size: 1rem; text-align: center; margin-bottom: 14px;
        }
        .ranking-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .ranking-table th, .ranking-table td { padding: 8px 10px; text-align: center; }
        .ranking-table th { color: var(--gold); border-bottom: 1px solid var(--border-soft); font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; }
        .ranking-table td { border-bottom: 1px solid rgba(255,255,255,0.04); color: #ddd; }
        .ranking-table tr.clickable { cursor: pointer; }
        .ranking-table tr.clickable:hover td { background: rgba(255, 215, 0, 0.08); }
        .ranking-empty { color: var(--muted); text-align: center; padding: 14px; font-size: 0.75rem; }

        /* STATS MODAL */
        .modal-card {
            background: linear-gradient(145deg, var(--setup-bg-1), var(--setup-bg-2));
            border: 2px solid var(--border-gold); border-radius: 16px;
            padding: 26px; max-width: 520px; width: calc(100% - 40px);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-card h3 { color: var(--gold); text-align: center; font-size: 1.1rem; margin-bottom: 14px; }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed rgba(255,215,0,0.15); font-size: 0.8rem; }
        .stat-row span:first-child { color: var(--muted); }
        .stat-row span:last-child { color: var(--gold); font-weight: 700; }
        .match-list { margin-top: 16px; font-size: 0.72rem; }
        .match-row { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; gap: 8px; }
        .match-row.won { color: var(--green); }
        .match-row.lost { color: #ccc; }
        .modal-close { display: block; margin: 16px auto 0; }
    </style>
</head>
<body>

<div class="neon-border"></div>
<div class="floating-cards" id="floatingCards"></div>

<div class="top-bar">
    <button class="icon-btn" id="themeBtn" title="Mudar tema" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn" title="Exportar banco" onclick="window.location='/api/export'">💾</button>
</div>

<div class="header">
    <h1>🃏 PONTINHO 🃏</h1>
    <div class="subtitle">★ VEGAS EDITION ★</div>
    <div id="roomBanner"></div>
    <div class="marquee-lights">
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
    </div>
</div>

<!-- SETUP -->
<div class="setup-screen" id="setupScreen">
    <div class="setup-card">
        <h2>🎰 CONFIGURAR MESA 🎰</h2>
        <datalist id="knownPlayers"></datalist>
        <div class="player-inputs" id="playerInputs">
            <div class="player-input-row">
                <label>Jogador 1:</label>
                <input type="text" list="knownPlayers" placeholder="Nome..." maxlength="16" value="Jogador 1">
                <button class="remove-btn" onclick="removePlayerInput(this)" title="Remover">✕</button>
            </div>
            <div class="player-input-row">
                <label>Jogador 2:</label>
                <input type="text" list="knownPlayers" placeholder="Nome..." maxlength="16" value="Jogador 2">
                <button class="remove-btn" onclick="removePlayerInput(this)" title="Remover">✕</button>
            </div>
        </div>
        <button class="add-player-btn" onclick="addPlayerInput()">+ ADICIONAR JOGADOR</button>

        <div class="settings-grid">
            <div class="field">
                <label>🎯 Limite (estoura em)</label>
                <input type="number" id="setLimit" value="101" min="10" max="9999">
            </div>
            <div class="field">
                <label>🚪 Sala / Mesa</label>
                <input type="text" id="setRoom" placeholder="global" maxlength="32">
            </div>
            <div class="field check">
                <input type="checkbox" id="setReentry" checked>
                <label for="setReentry">🔄 Permitir reentrada</label>
            </div>
            <div class="field check">
                <input type="checkbox" id="setMaxReentry">
                <label for="setMaxReentry">Limitar a 1 reentrada por jogador</label>
            </div>
        </div>

        <button class="btn btn-gold" onclick="startGame()">🎲 INICIAR JOGO 🎲</button>
    </div>

    <div class="ranking-card">
        <h3>🏆 RANKING DA SALA 🏆 <span id="rankingRoomLabel" style="color:var(--cyan);font-size:0.7rem"></span></h3>
        <div id="rankingContainer"><div class="ranking-empty">Carregando…</div></div>
    </div>
</div>

<!-- GAME -->
<div class="game-screen hidden" id="gameScreen">
    <div class="game-header">
        <div class="round-badge" id="roundBadge">🎯 Rodada: 1</div>
        <div>
            <button class="btn btn-red btn-sm" onclick="resetGame()">🔄 NOVO JOGO</button>
        </div>
    </div>

    <div class="players-grid" id="playersGrid"></div>

    <div class="actions-bar">
        <button class="btn btn-gold btn-sm" onclick="undoLastRound()" id="undoBtn" disabled>↩️ DESFAZER</button>
    </div>

    <div class="history-section">
        <h3>📜 HISTÓRICO DE RODADAS</h3>
        <div style="overflow-x: auto;">
            <table class="history-table" id="historyTable">
                <thead id="historyHead"></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- BOMB -->
<div class="overlay-base hidden" id="bombOverlay">
    <div class="bomb-emoji">💣</div>
    <div class="bomb-text">ESTOUROU!</div>
    <div class="bomb-player-name" id="bombPlayerName"></div>
    <div class="reentry-info" id="reentryInfo"></div>
    <div class="bomb-buttons">
        <button class="btn btn-reentry" id="reentryBtn" onclick="reenterFromBomb()">🔄 REENTRAR</button>
        <button class="btn btn-red" onclick="closeBomb()">❌ ELIMINADO</button>
    </div>
</div>

<!-- WINNER -->
<div class="overlay-base hidden" id="winnerOverlay" style="background: radial-gradient(ellipse at center, rgba(0,0,0,0.7), rgba(0,0,0,0.95));">
    <div class="winner-trophy">🏆</div>
    <div class="winner-text">VENCEDOR!</div>
    <div class="winner-name" id="winnerName"></div>
    <br>
    <button class="btn btn-gold" onclick="resetGame()">🎲 NOVO JOGO</button>
</div>

<!-- STATS MODAL -->
<div class="overlay-base hidden" id="statsOverlay" onclick="if(event.target===this)closeStats()">
    <div class="modal-card">
        <h3 id="statsTitle">📊 Estatísticas</h3>
        <div id="statsBody"><div class="ranking-empty">Carregando…</div></div>
        <button class="btn btn-ghost btn-sm modal-close" onclick="closeStats()">FECHAR</button>
    </div>
</div>

<div class="explosion-container" id="explosionContainer"></div>

<script>
    // ====== STATE ======
    const avatars = ['🃏','♠️','♥️','♦️','♣️','🎴','👑','💎','🎯','🎪'];
    let settings = { limit: 101, allowReentry: true, maxOneReentry: false, room: 'global' };
    let players = [];
    let round = 1;
    let history = []; // {type:'round', round, entries:{id:val}, winners:[id], eliminated:[id], prevScores:{id:val}} | {type:'reentry', round, playerId, previousScore, reentryScore}
    let pendingScores = {};
    let bombQueue = [];
    let currentBombPlayer = null;
    let matchSaved = false;

    // ====== ROOM ======
    function getRoomFromURL() {
        const params = new URLSearchParams(window.location.search);
        return (params.get('sala') || params.get('room') || 'global').toLowerCase()
            .replace(/[^a-z0-9_-]/g, '').slice(0, 32) || 'global';
    }
    settings.room = getRoomFromURL();

    function updateRoomBanner() {
        const el = document.getElementById('roomBanner');
        const label = document.getElementById('rankingRoomLabel');
        if (settings.room && settings.room !== 'global') {
            el.innerHTML = `<span class="room-badge">🚪 Sala: ${escapeHtml(settings.room)}</span>`;
            label.textContent = `· ${settings.room}`;
        } else {
            el.innerHTML = '';
            label.textContent = '';
        }
    }

    // ====== THEME ======
    function applyTheme(t) {
        document.body.classList.toggle('theme-calm', t === 'calm');
        document.getElementById('themeBtn').textContent = t === 'calm' ? '🎰' : '🌙';
        localStorage.setItem('pontinho_theme', t);
    }
    function toggleTheme() {
        const cur = localStorage.getItem('pontinho_theme') === 'calm' ? 'vegas' : 'calm';
        applyTheme(cur);
    }
    applyTheme(localStorage.getItem('pontinho_theme') || 'vegas');

    // ====== FLOATING CARDS ======
    (function createFloatingCards() {
        const container = document.getElementById('floatingCards');
        const suits = ['♠','♥','♦','♣','🃏'];
        for (let i = 0; i < 15; i++) {
            const card = document.createElement('div');
            card.className = 'floating-card';
            card.textContent = suits[Math.floor(Math.random() * suits.length)];
            card.style.left = Math.random() * 100 + '%';
            card.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
            card.style.animationDuration = (15 + Math.random() * 25) + 's';
            card.style.animationDelay = (Math.random() * 20) + 's';
            container.appendChild(card);
        }
    })();

    // ====== SETUP UI ======
    let playerCount = 2;
    function addPlayerInput() {
        playerCount++;
        const row = document.createElement('div');
        row.className = 'player-input-row';
        row.innerHTML = `
            <label>Jogador ${playerCount}:</label>
            <input type="text" list="knownPlayers" placeholder="Nome..." maxlength="16" value="Jogador ${playerCount}">
            <button class="remove-btn" onclick="removePlayerInput(this)" title="Remover">✕</button>`;
        document.getElementById('playerInputs').appendChild(row);
    }
    function removePlayerInput(btn) {
        const rows = document.querySelectorAll('.player-input-row');
        if (rows.length <= 2) return;
        btn.parentElement.remove();
    }

    // ====== UTILS ======
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function roomQuery() {
        return settings.room && settings.room !== 'global' ? ('?sala=' + encodeURIComponent(settings.room)) : '';
    }

    // ====== RANKING ======
    async function loadRanking() {
        try {
            const r = await fetch('/api/ranking' + roomQuery());
            const data = await r.json();
            const c = document.getElementById('rankingContainer');
            const list = data.ranking || [];
            if (!list.length) {
                c.innerHTML = '<div class="ranking-empty">Ninguém venceu nesta sala ainda. Bora jogar! 🎲</div>';
                return;
            }
            let html = '<table class="ranking-table"><thead><tr><th>#</th><th>Jogador</th><th>🏆 Vit.</th><th>🥇 Rod.</th><th>Jogos</th></tr></thead><tbody>';
            list.forEach((p, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1);
                html += `<tr class="clickable" onclick="showStats('${encodeURIComponent(p.name)}')">
                    <td>${medal}</td><td>${escapeHtml(p.name)}</td>
                    <td>${p.wins}</td><td>${p.round_wins}</td><td>${p.games_played}</td></tr>`;
            });
            html += '</tbody></table>';
            c.innerHTML = html;
        } catch {
            document.getElementById('rankingContainer').innerHTML =
                '<div class="ranking-empty">Não foi possível carregar o ranking.</div>';
        }
    }

    async function loadKnownPlayers() {
        try {
            const r = await fetch('/api/players' + roomQuery());
            const list = await r.json();
            document.getElementById('knownPlayers').innerHTML =
                list.map(n => `<option value="${escapeHtml(n)}">`).join('');
        } catch { /* ignore */ }
    }

    // ====== STATS MODAL ======
    async function showStats(encodedName) {
        const name = decodeURIComponent(encodedName);
        document.getElementById('statsTitle').textContent = `📊 ${name}`;
        const body = document.getElementById('statsBody');
        body.innerHTML = '<div class="ranking-empty">Carregando…</div>';
        document.getElementById('statsOverlay').classList.remove('hidden');
        try {
            const r = await fetch(`/api/stats/${encodeURIComponent(name)}${roomQuery()}`);
            if (!r.ok) { body.innerHTML = '<div class="ranking-empty">Sem dados.</div>'; return; }
            const s = await r.json();
            let html = `
                <div class="stat-row"><span>🏆 Vitórias de partida</span><span>${s.wins}</span></div>
                <div class="stat-row"><span>🥇 Rodadas vencidas</span><span>${s.round_wins}</span></div>
                <div class="stat-row"><span>🎲 Jogos disputados</span><span>${s.games_played}</span></div>
                <div class="stat-row"><span>📈 Win rate</span><span>${s.win_rate}%</span></div>
                <div class="stat-row"><span>⏱️ Média de rodadas/jogo</span><span>${s.avg_rounds_per_game}</span></div>
            `;
            if (s.history && s.history.length) {
                html += '<div class="match-list"><strong style="color:var(--gold);font-size:0.75rem;">Últimas partidas:</strong>';
                s.history.forEach(h => {
                    const date = new Date(h.played_at + 'Z').toLocaleString('pt-BR');
                    html += `<div class="match-row ${h.won ? 'won' : 'lost'}">
                        <span>${h.won ? '🏆' : '·'} vs ${escapeHtml(h.players.filter(p => p.toLowerCase() !== name.toLowerCase()).join(', '))}</span>
                        <span>${h.rounds} rod. · ${date}</span></div>`;
                });
                html += '</div>';
            }
            body.innerHTML = html;
        } catch {
            body.innerHTML = '<div class="ranking-empty">Erro ao carregar.</div>';
        }
    }
    function closeStats() { document.getElementById('statsOverlay').classList.add('hidden'); }

    // ====== START GAME ======
    function startGame() {
        const inputs = document.querySelectorAll('#playerInputs input');
        players = [];
        const seen = new Set();
        inputs.forEach((input, i) => {
            let name = input.value.trim() || `Jogador ${i + 1}`;
            let base = name, k = 2;
            while (seen.has(name.toLowerCase())) name = `${base} (${k++})`;
            seen.add(name.toLowerCase());
            players.push({ id: i, name, score: 0, eliminated: false, reentries: 0, avatar: avatars[i % avatars.length] });
        });
        if (players.length < 2) return;

        settings.limit = Math.max(10, parseInt(document.getElementById('setLimit').value, 10) || 101);
        settings.allowReentry = document.getElementById('setReentry').checked;
        settings.maxOneReentry = document.getElementById('setMaxReentry').checked;
        const roomInput = document.getElementById('setRoom').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 32);
        if (roomInput) settings.room = roomInput;
        // reflect in URL
        const url = new URL(window.location);
        if (settings.room !== 'global') url.searchParams.set('sala', settings.room);
        else url.searchParams.delete('sala');
        window.history.replaceState({}, '', url);

        round = 1;
        history = [];
        pendingScores = {};
        bombQueue = [];
        currentBombPlayer = null;
        matchSaved = false;

        updateRoomBanner();
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        renderGame();
    }

    // ====== RENDER ======
    function renderGame() {
        renderPlayers();
        renderHistory();
        document.getElementById('roundBadge').textContent = `🎯 Rodada: ${round}`;
        document.getElementById('undoBtn').disabled = history.length === 0;
        checkWinner();
    }

    function renderPlayers() {
        const grid = document.getElementById('playersGrid');
        grid.innerHTML = '';
        players.forEach(p => {
            const remaining = settings.limit - p.score;
            const isDanger = remaining <= 15 && !p.eliminated;
            const hasReentered = p.reentries > 0;
            const submitted = pendingScores[p.id] !== undefined;
            const card = document.createElement('div');
            card.className = [
                'player-card',
                p.eliminated ? 'eliminated' : '',
                isDanger ? 'danger' : '',
                hasReentered && !p.eliminated ? 'reentered' : '',
                submitted ? 'pending-submitted' : ''
            ].filter(Boolean).join(' ');
            card.id = `card-${p.id}`;

            let html = `<div class="player-avatar">${p.avatar}</div>
                        <div class="player-name">${escapeHtml(p.name)}</div>`;

            if (hasReentered) {
                const txt = p.reentries === 1 ? '🔄 REENTRADA'
                    : `🔄 <span class="reentry-count">${p.reentries}x</span> REENTRADAS`;
                html += `<div class="reentry-badge">${txt}</div>`;
            }

            if (p.eliminated) {
                const canReenter = settings.allowReentry &&
                    !(settings.maxOneReentry && p.reentries >= 1);
                html += `<div class="player-score" style="-webkit-text-fill-color:#ff4444;">💥 ${p.score}</div>
                         <div class="player-remaining" style="color:#ff4444;">ELIMINADO</div>
                         <div class="eliminated-badge">💣</div>`;
                if (canReenter) {
                    html += `<div class="eliminated-actions">
                        <button class="btn btn-reentry btn-sm" onclick="reenterPlayer(${p.id})">🔄 REENTRAR</button>
                    </div>`;
                }
            } else {
                html += `<div class="player-score">${p.score}</div>
                         <div class="player-remaining">Faltam <span>${remaining}</span> pts</div>`;
                if (submitted) {
                    html += `<div class="pending-badge">✅ +${pendingScores[p.id]} (aguardando)</div>`;
                } else {
                    html += `<div class="score-input-area">
                        <input type="number" min="0" id="input-${p.id}" placeholder="Pts"
                               onkeydown="if(event.key==='Enter')addScore(${p.id})">
                        <button class="btn btn-green btn-sm" onclick="addScore(${p.id})">OK</button>
                    </div>`;
                }
            }

            card.innerHTML = html;
            grid.appendChild(card);
        });
    }

    // ====== ROUND LOGIC ======
    function addScore(playerId) {
        const input = document.getElementById(`input-${playerId}`);
        if (!input) return;
        const value = parseInt(input.value, 10);
        if (isNaN(value) || value < 0) return;
        const player = players[playerId];
        if (player.eliminated || pendingScores[playerId] !== undefined) return;

        pendingScores[playerId] = value;
        renderPlayers();

        const active = players.filter(p => !p.eliminated);
        const missing = active.filter(p => pendingScores[p.id] === undefined);

        if (missing.length === 0) commitRound();
        else if (missing.length === 1) {
            // Único ativo restante = vencedor da rodada (0 pts)
            pendingScores[missing[0].id] = 0;
            renderPlayers();
            commitRound();
        }
    }

    function commitRound() {
        const entries = { ...pendingScores };
        const ids = Object.keys(entries).map(Number);
        if (!ids.length) return;
        const minVal = Math.min(...ids.map(id => entries[id]));
        const winners = ids.filter(id => entries[id] === minVal);

        const record = { type: 'round', round, entries, winners, eliminated: [], prevScores: {} };
        ids.forEach(id => {
            const p = players[id];
            record.prevScores[id] = p.score;
            p.score += entries[id];
            if (p.score >= settings.limit) {
                p.eliminated = true;
                record.eliminated.push(id);
                bombQueue.push(p);
            }
        });
        history.push(record);
        winners.forEach(id => flashScore(id, '🏆'));
        ids.forEach(id => {
            if (!winners.includes(id) && entries[id] > 0) flashScore(id, `+${entries[id]}`);
        });
        pendingScores = {};
        round++;
        renderGame();
        if (bombQueue.length > 0) showBomb(bombQueue.shift());
    }

    function flashScore(playerId, text) {
        const card = document.getElementById(`card-${playerId}`);
        if (!card) return;
        const flash = document.createElement('div');
        flash.className = 'score-flash';
        flash.style.color = String(text).includes('🏆') ? '#ffd700' : '#ff4444';
        flash.textContent = text;
        card.appendChild(flash);
        setTimeout(() => flash.remove(), 1500);
    }

    // ====== BOMB ======
    function showBomb(player) {
        const canReenter = settings.allowReentry &&
            !(settings.maxOneReentry && player.reentries >= 1);
        currentBombPlayer = player;
        document.getElementById('bombPlayerName').textContent =
            `${player.avatar} ${player.name} ultrapassou ${settings.limit} pts!`;
        const reentryScore = getReentryScore();
        const info = document.getElementById('reentryInfo');
        const reentryBtn = document.getElementById('reentryBtn');
        if (canReenter) {
            info.innerHTML = `Reentrar com <span>${reentryScore}</span> pontos (maior pontuação atual)`;
            reentryBtn.classList.remove('hidden');
        } else {
            info.innerHTML = settings.allowReentry
                ? `Reentrada não permitida (já reentrou ${player.reentries}x)`
                : 'Reentrada desabilitada nesta partida';
            reentryBtn.classList.add('hidden');
        }
        document.getElementById('bombOverlay').classList.remove('hidden');
        createExplosion();
    }

    function getReentryScore() {
        const active = players.filter(p => !p.eliminated);
        if (!active.length) return 1;
        return Math.max(...active.map(p => p.score));
    }

    function reenterFromBomb() {
        if (!currentBombPlayer) return;
        doReentry(currentBombPlayer.id);
        currentBombPlayer = null;
        document.getElementById('bombOverlay').classList.add('hidden');
        if (bombQueue.length > 0) showBomb(bombQueue.shift());
        else renderGame();
    }

    function reenterPlayer(playerId) {
        const p = players[playerId];
        if (!p || !p.eliminated) return;
        if (!settings.allowReentry) return;
        if (settings.maxOneReentry && p.reentries >= 1) return;
        doReentry(playerId);
        renderGame();
    }

    function doReentry(playerId) {
        const p = players[playerId];
        const previousScore = p.score;
        const reentryScore = getReentryScore();
        p.score = reentryScore;
        p.eliminated = false;
        p.reentries++;
        history.push({ type: 'reentry', round, playerId, previousScore, reentryScore });
    }

    function closeBomb() {
        currentBombPlayer = null;
        document.getElementById('bombOverlay').classList.add('hidden');
        if (bombQueue.length > 0) showBomb(bombQueue.shift());
        else renderGame();
    }

    function createExplosion() {
        const container = document.getElementById('explosionContainer');
        container.innerHTML = '';
        const colors = ['#ff0044', '#ffd700', '#ff8800', '#ff4488', '#ff6600', '#ffcc00'];
        for (let i = 0; i < 60; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = 4 + Math.random() * 12;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.left = '50%'; particle.style.top = '50%';
            const angle = Math.random() * Math.PI * 2;
            const distance = 100 + Math.random() * 400;
            particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            particle.style.animationDuration = (0.8 + Math.random()) + 's';
            container.appendChild(particle);
        }
        setTimeout(() => container.innerHTML = '', 2000);
    }

    // ====== WINNER ======
    function checkWinner() {
        const active = players.filter(p => !p.eliminated);
        if (active.length === 1 && players.some(p => p.eliminated)) {
            showWinner(active[0]);
        } else if (active.length === 0 && players.length > 0) {
            const w = players.reduce((a, b) => (a.score <= b.score ? a : b));
            showWinner(w);
        }
    }

    function showWinner(player) {
        if (matchSaved) return;
        matchSaved = true;
        document.getElementById('winnerName').textContent = `${player.avatar} ${player.name}`;
        document.getElementById('winnerOverlay').classList.remove('hidden');
        player.winner = true;
        renderPlayers();
        const card = document.getElementById(`card-${player.id}`);
        if (card) card.classList.add('winner');
        createConfetti();
        saveMatch(player);
    }

    function buildRoundsDetail() {
        const idToName = {};
        players.forEach(p => idToName[p.id] = p.name);
        return history.map(h => {
            if (h.type === 'round') {
                const entries = {};
                Object.entries(h.entries).forEach(([id, v]) => { entries[idToName[+id]] = v; });
                return {
                    type: 'round', round: h.round,
                    entries, winners: h.winners.map(id => idToName[id]),
                    eliminated: h.eliminated.map(id => idToName[id]),
                };
            }
            return {
                type: 'reentry', round: h.round,
                player: idToName[h.playerId],
                score_before: h.previousScore, score_after: h.reentryScore,
            };
        });
    }

    async function saveMatch(winner) {
        const roundWins = {};
        history.forEach(h => {
            if (h.type === 'round' && Array.isArray(h.winners)) {
                h.winners.forEach(id => {
                    const name = players[id].name;
                    roundWins[name] = (roundWins[name] || 0) + 1;
                });
            }
        });
        try {
            const url = '/api/match' + roomQuery();
            await fetch(url, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    winner: winner.name,
                    players: players.map(p => p.name),
                    rounds: history.filter(h => h.type === 'round').length,
                    round_wins: roundWins,
                    rounds_detail: buildRoundsDetail(),
                    settings: settings,
                    room: settings.room
                })
            });
        } catch { /* offline tolerable */ }
    }

    function createConfetti() {
        const colors = ['#ffd700', '#ff0055', '#00ff88', '#00ddff', '#ff8800', '#aa55ff'];
        for (let i = 0; i < 80; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti-piece';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = (5 + Math.random() * 10) + 'px';
            confetti.style.height = (5 + Math.random() * 10) + 'px';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
            confetti.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(confetti);
        }
        setTimeout(() => document.querySelectorAll('.confetti-piece').forEach(c => c.remove()), 6000);
    }

    // ====== HISTORY ======
    function renderHistory() {
        const head = document.getElementById('historyHead');
        const body = document.getElementById('historyBody');
        let headHTML = '<tr><th>Rodada</th>';
        players.forEach(p => { headHTML += `<th>${p.avatar} ${escapeHtml(p.name)}</th>`; });
        head.innerHTML = headHTML + '</tr>';

        let bodyHTML = '';
        history.forEach(h => {
            if (h.type === 'reentry') {
                bodyHTML += `<tr><td style="color:var(--cyan);font-weight:bold">R${h.round}↺</td>`;
                players.forEach(p => {
                    bodyHTML += (p.id === h.playerId)
                        ? `<td style="color:var(--cyan);font-weight:bold;">🔄 ${h.reentryScore}</td>`
                        : `<td class="zero">-</td>`;
                });
                bodyHTML += '</tr>';
            } else {
                bodyHTML += `<tr><td style="color:var(--gold);font-weight:bold">${h.round}</td>`;
                players.forEach(p => {
                    const v = h.entries[p.id];
                    if (v === undefined) bodyHTML += `<td class="zero">-</td>`;
                    else if (h.winners.includes(p.id))
                        bodyHTML += `<td class="trophy-cell" title="Vencedor (${v} pt${v===1?'':'s'})">🏆</td>`;
                    else {
                        const cls = v > 0 ? 'positive' : 'zero';
                        bodyHTML += `<td class="${cls}">${v > 0 ? '+'+v : v}</td>`;
                    }
                });
                bodyHTML += '</tr>';
            }
        });

        bodyHTML += '<tr style="border-top:2px solid rgba(255,215,0,0.3);font-weight:bold;">';
        bodyHTML += '<td style="color:var(--gold);">TOTAL</td>';
        players.forEach(p => {
            const color = p.eliminated ? '#ff4444' : 'var(--green)';
            bodyHTML += `<td style="color:${color};font-size:0.85rem;">${p.score}</td>`;
        });
        bodyHTML += '</tr>';
        body.innerHTML = bodyHTML;
    }

    // ====== UNDO ======
    function undoLastRound() {
        if (!history.length) return;
        const last = history.pop();
        if (last.type === 'reentry') {
            const p = players[last.playerId];
            p.score = last.previousScore;
            p.eliminated = true;
            p.reentries = Math.max(0, p.reentries - 1);
        } else {
            Object.entries(last.prevScores).forEach(([id, sc]) => { players[+id].score = sc; });
            last.eliminated.forEach(id => { players[id].eliminated = false; });
            bombQueue = bombQueue.filter(p => !last.eliminated.includes(p.id));
            round = Math.max(1, round - 1);
        }
        document.getElementById('winnerOverlay').classList.add('hidden');
        document.getElementById('bombOverlay').classList.add('hidden');
        players.forEach(p => p.winner = false);
        matchSaved = false;
        renderGame();
    }

    // ====== RESET ======
    function resetGame() {
        document.getElementById('winnerOverlay').classList.add('hidden');
        document.getElementById('bombOverlay').classList.add('hidden');
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('setupScreen').classList.remove('hidden');
        players = []; history = []; round = 1;
        pendingScores = {}; bombQueue = []; currentBombPlayer = null; matchSaved = false;
        loadRanking();
        loadKnownPlayers();
    }

    // ====== BOOT ======
    updateRoomBanner();
    document.getElementById('setRoom').value = settings.room === 'global' ? '' : settings.room;
    loadRanking();
    loadKnownPlayers();

    // Service worker (PWA)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
</script>
